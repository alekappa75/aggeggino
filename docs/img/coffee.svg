<svg xmlns="http://www.w3.org/2000/svg" width="212" height="40" viewBox="0 0 212 40" role="img" aria-label="Buy me a coffee">
  <title>Buy me a coffee</title>

  <!-- Its own background and border: an <img> on GitHub inherits neither the
       page's foreground nor its background, so the badge has to carry both or
       it vanishes in one of the two themes. Same reason as networks.svg. -->
  <rect x="0.75" y="0.75" width="210.5" height="38.5" rx="8"
        fill="#151A21" stroke="#3C444E" stroke-width="1.5"/>

  <!-- steam -->
  <g stroke="#EFA02A" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M21.5 12.5 Q23.4 9.6 21.5 6.8"/>
    <path d="M27.5 12.5 Q29.4 9.6 27.5 6.8"/>
  </g>

  <!-- cup -->
  <path d="M15.5 16 H32.5 L30.8 27.4 Q30.4 29.8 28 29.8 H20 Q17.6 29.8 17.2 27.4 Z"
        fill="none" stroke="#EFA02A" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M33 18.6 Q37.6 18.6 37.6 22 Q37.6 25.4 32.2 25.4"
        fill="none" stroke="#EFA02A" stroke-width="1.8" stroke-linecap="round"/>

  <text x="130" y="25" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14.5" font-weight="600" letter-spacing="0.2" fill="#FFFFFF">Buy me a coffee</text>
</svg>
